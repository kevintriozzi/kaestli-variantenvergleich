name: Cloudflare veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      CLOUDFLARE_ACCESS_AUD: ${{ vars.CLOUDFLARE_ACCESS_AUD }}
      CLOUDFLARE_ACCESS_ISSUER: ${{ vars.CLOUDFLARE_ACCESS_ISSUER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm run install:ci
      - run: npm run lint
      - run: npm test
      - run: npm run deploy:config

      - run: >
          npx wrangler d1 migrations apply
          "$CLOUDFLARE_D1_DATABASE_NAME"
          --remote
          --config .wrangler.deploy.jsonc

      - run: npx wrangler deploy --config .wrangler.deploy.jsonc
